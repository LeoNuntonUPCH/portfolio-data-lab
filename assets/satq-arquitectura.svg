<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de SATQ Digital</title>
  <desc id="desc">Flujo del prototipo: datos simulados de quebradas, motor de riesgo, panel territorial y alertas.</desc>
