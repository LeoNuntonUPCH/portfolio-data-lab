  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g fill="none" stroke="#c5d8d2" stroke-width="1"><path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200M0 630h1200"/><path d="M100 0v675M250 0v675M400 0v675M550 0v675M700 0v675M850 0v675M1000 0v675M1150 0v675"/></g>
