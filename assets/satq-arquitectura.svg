    <text x="671" y="336" fill="#172a2d" font-size="25" font-weight="700">Panel territorial</text><text x="671" y="373" fill="#516267" font-size="18">Mapa y gráficos</text><text x="671" y="405" fill="#516267" font-size="16">Vista de monitoreo</text>
    <rect x="934" y="240" width="202" height="196" rx="20" fill="#fffdfa" stroke="#a9c9c0" stroke-width="3"/>
