    <text x="381" y="336" fill="#172a2d" font-size="25" font-weight="700">Motor de riesgo</text><text x="381" y="373" fill="#516267" font-size="18">Umbrales configurables</text><text x="381" y="405" fill="#516267" font-size="16">Bajo · Moderado · Alto</text>
    <rect x="644" y="240" width="232" height="196" rx="20" fill="#fffdfa" stroke="#a9c9c0" stroke-width="3"/>
